<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
    integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" 
    crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-response-targets@2.0.4" 
    integrity="sha384-T41oglUPvXLGBVyRdZsVRxNWnOOqCynaPubjUVjxhsjFTKrFJGEMm3/0KGmNQ+Pg" 
    crossorigin="anonymous">
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>emuu: home</title>
    <style>
        /* Custom HTMX indicator styling */
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
    </style>
</head>
<body hx-ext="response-targets" class="min-h-screen bg-white font-sans text-gray-900 flex flex-col overflow-y-scroll">

    <!-- MAIN HEADER -->
    <header class="bg-indigo-500 border-b border-gray-300 px-6 py-4 flex flex-col sm:flex-row sm:items-end gap-6 shadow-sm">
        <div class="flex items-center gap-4">
            <!-- Orange Snoo-style icon -->
            <div class="w-10 h-10 bg-fuchsia-200 border-2 border-black rounded-full flex-shrink-0 shadow-sm"></div>
            <h1 class="text-2xl font-bold tracking-tight text-gray-200">emuu</h1>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="max-w-3xl w-full mx-auto py-8 px-4 flex-grow flex flex-col gap-8">

        <p>Logged in as: {{ username }}</p>
        <form hx-post="/logout">
            <button type="submit" 
                class="mt-3 px-5 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold text-sm rounded-sm transition-colors shadow-sm border border-gray-400">
                Logout
            </button>
        </form>

        <h2 class="text-lg font-bold text-blue-800 mb-1">Make A Post</h2>

        <form hx-post="/posts">
            <input type="text" name="input" required placeholder="Type your content..."
                class="w-full p-2.5 border border-gray-400 bg-white shadow-inner focus:outline-none focus:border-blue-500 rounded-sm text-sm"
            />

            <button type="submit" 
                class="mt-3 px-5 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold text-sm rounded-sm transition-colors shadow-sm border border-gray-400">
                Post
            </button>
        </form>

        <h2 class="text-lg font-bold text-blue-800 mb-1">Posts</h2>

        {% for post in posts %}
            <div class="bg-gray-50 border border-gray-300 p-5 rounded-sm">
                <p>id: {{ post[0] }}</p>
                <p>username: {{ post[1] }}</p>
                <p>content: {{ post[2] }}</p>
                <p>time: {{ post[3] }}</p>
            </div>
        {% endfor %}

    </main>
    <!-- FOOTER -->
    <footer class="border-t border-gray-300 bg-indigo-500 mt-auto">
        <div class="max-w-3xl mx-auto px-6 py-4 flex flex-col items-center justify-center text-center text-xs text-gray-200 gap-2">
            <div>
                <p><strong>emuu</p>
            </div>
        </div>
    </footer>

</body>
</html>
