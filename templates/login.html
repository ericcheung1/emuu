<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
    integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" 
    crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-response-targets@2.0.4" 
    integrity="sha384-T41oglUPvXLGBVyRdZsVRxNWnOOqCynaPubjUVjxhsjFTKrFJGEMm3/0KGmNQ+Pg" 
    crossorigin="anonymous">
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>emuu: login</title>
</head>
<body class="min-h-screen bg-white font-sans text-gray-900 flex flex-col overflow-y-scroll">

    <!-- MAIN CONTENT AREA -->
    <main class="max-w-3xl w-full mx-auto py-8 px-4 flex-grow flex flex-col gap-8">

        <!-- TOOL 2: SENTENCE -->
        <div class="bg-gray-50 border border-gray-300 p-5 rounded-sm">
            <h2 class="text-lg font-bold text-blue-800 mb-1">Login</h2>

            <form hx-post="/login">
                <input type="text" name="username" required placeholder="Type your username..."
                    class="w-full p-2.5 border border-gray-400 bg-white shadow-inner focus:outline-none focus:border-blue-500 rounded-sm text-sm"
                />
                <button type="submit" 
                    class="mt-3 px-5 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold text-sm rounded-sm transition-colors shadow-sm border border-gray-400">
                    Login
                </button>
            </form>

        </div>
   
    </main>
</body>
</html>
